[package]
name = "reelforge-desktop"
version = "0.0.0"
description = "ReelForge desktop studio"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "reelforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
